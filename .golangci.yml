version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - gocyclo
    - gosec
  settings:
    gocyclo:
      min-complexity: 15
    errcheck:
      check-type-assertions: true
    govet:
      enable:
        - shadow
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - gocyclo

formatters:
  enable:
    - gofumpt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
